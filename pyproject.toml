[project]
name = "olist-dispute-resolution"
version = "0.1.0"
description = "Multi-agent, evidence-based Olist dispute resolution"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dispute-resolution = "dispute_resolution.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
